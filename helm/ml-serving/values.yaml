# Default values for the ml-serving chart.

replicaCount: 2

image:
  repository: 316412036948.dkr.ecr.ap-south-1.amazonaws.com/ml-serving
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

probes:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10
